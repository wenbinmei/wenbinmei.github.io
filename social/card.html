<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wenbin Mei – link preview card</title>
<style>
  /* 1200x630 is the size LinkedIn, X and most email clients use for large link previews. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 64px; padding: 0 88px; box-sizing: border-box;
    background: radial-gradient(circle at 15% 20%, #1e3a8a 0%, #0f172a 55%, #0b1120 100%);
    color: #f8fafc; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  img {
    width: 300px; height: 300px; border-radius: 50%; object-fit: cover; flex: none;
    border: 6px solid rgba(147, 197, 253, 0.55); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  h1 { font-size: 68px; line-height: 1.05; margin: 0 0 14px; font-weight: 800; letter-spacing: -1px; }
  .role { font-size: 34px; color: #93c5fd; font-weight: 600; margin: 0 0 22px; }
  .tag { font-size: 25px; line-height: 1.4; color: #cbd5e1; margin: 0 0 30px; max-width: 640px; }
  .url { font-size: 24px; color: #94a3b8; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <img src="../assets/img/me.jpg" alt="">
  <div>
    <h1>Wenbin Mei, PhD</h1>
    <p class="role">Computational Biology &amp; AI Leader</p>
    <p class="tag">Predictive modeling for target discovery &amp; multiplex gene editing · Building high-impact teams</p>
    <div class="url">wenbinmei.github.io</div>
  </div>
</body>
</html>
